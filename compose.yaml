services:
  backend:
    image: gnomad-browser-lite-backend:local
    platform: linux/amd64

    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      PORT: "8000"
      RUST_LOG: "${RUST_LOG:-info}"

    volumes:
      - ./config/gbl.toml:/config/gbl.toml:ro
      - ./data:/data:ro

    command:
      - "--config"
      - "/config/gbl.toml"

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    image: gnomad-browser-lite-frontend:local
    platform: linux/amd64

    build:
      context: .
      dockerfile: frontend/Dockerfile

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    restart: unless-stopped
