services:
  backend:
    image: gnomad-browser-lite-backend:local

    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      PORT: "8000"
      RUST_LOG: "${RUST_LOG:-info}"

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    image: gnomad-browser-lite-frontend:local

    build:
      context: .
      dockerfile: frontend/Dockerfile

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    restart: unless-stopped
